<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Cómo leer el indicador de Sakura Performance</title><desc id="desc">Tiempo total, TTFT, velocidad de generación y uso del contexto.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172a"/><stop offset="1" stop-color="#202b45"/></linearGradient></defs><rect width="1200" height="470" rx="28" fill="url(#bg)"/><text x="56" y="64" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SAKURA PERFORMANCE</text><text x="56" y="108" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Cómo leer el indicador</text><rect x="56" y="132" width="1088" height="72" rx="16" fill="#0b1020" stroke="#3d4a67"/><text x="82" y="177" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">⏱️ 12.40s · ⚡ 0.85s · 🚀 42.3t/s · 🟢 8.2K/40.2K (20%)</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="56" y="230" width="254" height="184" rx="18" fill="#182238" stroke="#34415d"/><rect x="56" y="230" width="254" height="5" rx="3" fill="#a78bfa"/><text x="78" y="270" fill="#c4b5fd" font-size="14" font-weight="700">TIEMPO TOTAL</text><text x="78" y="311" fill="#fff" font-size="23" font-weight="700">12.40 segundos</text><text x="78" y="347" fill="#cbd5e1" font-size="15">Inicio de solicitud hasta el</text><text x="78" y="371" fill="#cbd5e1" font-size="15">evento final de Open WebUI.</text><rect x="330" y="230" width="254" height="184" rx="18" fill="#182238" stroke="#34415d"/><rect x="330" y="230" width="254" height="5" rx="3" fill="#60a5fa"/><text x="352" y="270" fill="#93c5fd" font-size="14" font-weight="700">TTFT · PRIMER TOKEN</text><text x="352" y="311" fill="#fff" font-size="23" font-weight="700">0.85 segundos</text><text x="352" y="347" fill="#cbd5e1" font-size="15">Hasta que Open WebUI detecta</text><text x="352" y="371" fill="#cbd5e1" font-size="15">el primer fragmento de texto.</text><rect x="604" y="230" width="254" height="184" rx="18" fill="#182238" stroke="#34415d"/><rect x="604" y="230" width="254" height="5" rx="3" fill="#34d399"/><text x="626" y="270" fill="#6ee7b7" font-size="14" font-weight="700">VELOCIDAD DE GENERACIÓN</text><text x="626" y="311" fill="#fff" font-size="23" font-weight="700">42.3 tokens/s</text><text x="626" y="347" fill="#cbd5e1" font-size="15">Tokens generados divididos por</text><text x="626" y="371" fill="#cbd5e1" font-size="15">tiempo de generación informado.</text><rect x="878" y="230" width="266" height="184" rx="18" fill="#182238" stroke="#34415d"/><rect x="878" y="230" width="266" height="5" rx="3" fill="#4ade80"/><text x="900" y="270" fill="#86efac" font-size="14" font-weight="700">USO DEL CONTEXTO</text><text x="900" y="311" fill="#fff" font-size="23" font-weight="700">8.2K / 40.2K · 20%</text><text x="900" y="347" fill="#cbd5e1" font-size="15">Tokens del prompt / límite de</text><text x="900" y="371" fill="#cbd5e1" font-size="15">contexto. K significa mil tokens.</text></g><text x="56" y="447" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Umbrales de contexto: amarillo 70% · naranja 85% · rojo 95%.</text></svg>
